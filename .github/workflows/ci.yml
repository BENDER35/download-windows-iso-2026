---
name: CI

on:
  push:
  schedule:
    - cron: "0 0 * * *" # daily

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v3

      - name: Pip Packages
        run: |-
          pip install -- mypy
          pip install -r ./requirements.txt

      - name: Lint
        run: |-
          mypy -- .

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n release.sh download.sh distrobuilder.sh

      - name: ShellCheck
        run: shellcheck release.sh download.sh distrobuilder.sh

      - name: Helper tests
        run: ./tests/release_test.sh

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test
        run: ./download.sh
